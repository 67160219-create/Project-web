<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบวิเคราะห์สูตร</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #fce7f3, #e0e7ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 350px;
    }
    h1 {
      color: #4f46e5;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn1 {
      background: #ec4899;
      color: white;
    }
    .btn2 {
      background: #6366f1;
      color: white;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>ระบบวิเคราะห์สูตร</h1>
    <p>กรุณาเลือกเมนู</p>

    <button class="btn1" onclick="goBenefit()">เลือกตามสรรพคุณ</button>
    <button class="btn2" onclick="goAnalyze()">วิเคราะห์สูตร</button>
  </div>

  <script>
    function goBenefit() {
      window.location.href = "benefit.html";
    }

    function goAnalyze() {
      window.location.href = "analyze.html";
    }
  </script>

</body>
</html>
