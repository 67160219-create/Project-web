<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>วิเคราะห์สูตร</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      background: white;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    h1 {
      text-align: center;
      color: #4338ca;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>วิเคราะห์สูตรสมุนไพร</h1>

    <form>
      <label>ชื่อ – นามสกุล</label>
      <input type="text" placeholder="กรอกชื่อของคุณ">

      <label>อายุ</label>
      <input type="number" placeholder="กรอกอายุ">

      <label>เพศ</label>
      <select>
        <option>เลือกเพศ</option>
        <option>ชาย</option>
        <option>หญิง</option>
        <option>อื่น ๆ</option>
      </select>

      <label>โรคประจำตัว</label>
      <textarea rows="3" placeholder="ถ้าไม่มี ให้พิมพ์ -"></textarea>

      <label>อาการที่ต้องการวิเคราะห์</label>
      <textarea rows="4" placeholder="เช่น ไอ เจ็บคอ ปวดเมื่อย"></textarea>

      <button type="button">วิเคราะห์สูตร</button>
    </form>

    <a href="index.html" class="back">⬅ กลับหน้าแรก</a>
  </div>

</body>
</html>
