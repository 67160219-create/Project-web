<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Formula Analysis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green-main:#a8b88e;
  --green-dark:#6b7c5b;
  --bg:#f7f8f2;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",sans-serif;
  background:var(--bg);
  color:#2f3e2f;
}

/* ===== NAV ===== */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
}

.menu a{
  display:inline-block;
  margin-right:10px;
  padding:10px 20px;
  background:var(--green-main);
  color:#fff;
  text-decoration:none;
  border-radius:25px;
  font-size:14px;
  box-shadow:0 3px 6px rgba(0,0,0,0.15);
  transition:0.3s;
}

.menu a:hover{
  background:var(--green-dark);
  transform:translateY(-2px);
}

.auth{
  font-size:14px;
}

/* ===== HERO ===== */
.hero{
  background: linear-gradient(135deg,#a8b88e,#c6d3b1);
  height:300px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-radius:0 0 80px 80px;
  position:relative;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  bottom:-20px;
  left:0;
  width:100%;
  height:60px;
  background:var(--bg);
  border-radius:50%;
}

.hero h1{
  font-size:56px;
  margin:0;
}

.hero p{
  margin-top:10px;
  font-size:18px;
  opacity:0.85;
}

/* ===== ANALYSIS FORM ===== */
.analysis{
  max-width:900px;
  margin:-40px auto 80px;
  padding:40px;
  background:#fff;
  border-radius:30px;
  box-shadow:0 15px 35px rgba(0,0,0,0.12);
}

.analysis h2{
  font-size:26px;
  margin-bottom:25px;
  text-align:center;
}

.form-group{
  margin-bottom:22px;
  text-align:left;
}

.form-group label{
  display:block;
  font-weight:600;
  margin-bottom:8px;
}

.form-group select,
.form-group input{
  width:100%;
  padding:12px 16px;
  border-radius:20px;
  border:1px solid #ccc;
  font-size:15px;
}

.form-group select:focus,
.form-group input:focus{
  outline:none;
  border-color:var(--green-main);
}

/* ===== BUTTON ===== */
.btn-analyze{
  display:block;
  margin:30px auto 0;
  padding:14px 40px;
  border:none;
  border-radius:30px;
  background:var(--green-main);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
  transition:0.3s;
}

.btn-analyze:hover{
  background:var(--green-dark);
  transform:translateY(-2px);
}

/* ===== RESULT ===== */
.result{
  margin-top:40px;
  background:#f1f4eb;
  padding:25px;
  border-radius:25px;
}

.result h3{
  margin-top:0;
  margin-bottom:15px;
}

.result ul{
  padding-left:20px;
}

.result li{
  margin-bottom:8px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <div class="menu">
    <a href="index.html">Home</a>
    <a href="analyze.html">Formula Analysis</a>
    <a href="benefit.html">Herbal Properties</a>
    <a href="myformula.html">My Formula</a>
  </div>
  <div class="auth">Login | Sign up</div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Formula Analysis</h1>
  <p>วิเคราะห์สูตรสมุนไพรให้เหมาะกับคุณ</p>
</div>

<!-- ANALYSIS -->
<div class="analysis">
  <h2>วิเคราะห์สูตรสมุนไพร</h2>

  <div class="form-group">
    <label>เป้าหมายสุขภาพ</label>
    <select>
      <option>เลือกเป้าหมาย</option>
      <option>เสริมภูมิคุ้มกัน</option>
      <option>บำรุงร่างกาย</option>
      <option>ลดความเหนื่อยล้า</option>
      <option>ช่วยย่อยอาหาร</option>
    </select>
  </div>

  <div class="form-group">
    <label>อายุ</label>
    <input type="number" placeholder="กรอกอายุ">
  </div>

  <div class="form-group">
    <label>โรคประจำตัว (ถ้ามี)</label>
    <input type="text" placeholder="เช่น ความดัน เบาหวาน">
  </div>

  <button class="btn-analyze">วิเคราะห์สูตร</button>

  <!-- RESULT (ตัวอย่างผลลัพธ์) -->
  <div class="result">
    <h3>ผลการวิเคราะห์เบื้องต้น</h3>
    <ul>
      <li>ขมิ้นชัน – ช่วยต้านการอักเสบ</li>
      <li>ฟ้าทะลายโจร – เสริมภูมิคุ้มกัน</li>
      <li>ขิง – ช่วยระบบย่อยอาหาร</li>
    </ul>
  </div>
</div>

</body>
</html>
