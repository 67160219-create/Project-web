<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Project-web</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green-main:#a8b88e;
  --green-dark:#6b7c5b;
  --bg:#f7f8f2;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI",sans-serif;
  background:var(--bg);
  color:#2f3e2f;
}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(135deg,#a8b88e,#c6d3b1);
  padding:90px 20px 130px;
  text-align:center;
  border-radius:0 0 80px 80px;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  bottom:-1px;
  left:0;
  width:100%;
  height:70px;
  background:var(--bg);
  border-top-left-radius:100% 70px;
  border-top-right-radius:100% 70px;
}

.hero h1{
  font-size:46px;
  margin:0;
}

/* ===== LOGIN CARD ===== */
.section{
  max-width:420px;
  margin:60px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border-radius:25px;
  padding:30px;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
}

.card h2{
  text-align:center;
  margin-top:0;
}

/* ===== FORM ===== */
.input-group{
  margin-bottom:18px;
}

.input-group label{
  display:block;
  margin-bottom:6px;
}

.input-group input{
  width:100%;
  padding:12px 16px;
  border-radius:20px;
  border:1px solid #ccc;
  font-size:15px;
}

.input-group input:focus{
  outline:none;
  border-color:var(--green-main);
}

/* ===== BUTTONS ===== */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:25px;
  background:var(--green-main);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:var(--green-dark);
}

.btn-back{
  display:block;
  margin-top:15px;
  text-align:center;
  padding:10px;
  border-radius:25px;
  background:#f1f4eb;
  color:#2f3e2f;
  text-decoration:none;
  font-size:14px;
  transition:0.3s;
}

.btn-back:hover{
  background:#e3ead6;
}

/* ===== NOTE ===== */
.note{
  margin-top:15px;
  font-size:14px;
  text-align:center;
  color:#666;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>Project-web</h1>
</div>

<!-- LOGIN -->
<div class="section">
  <div class="card">
    <h2>Login / สมัครสมาชิก</h2>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="กรอกรหัสผ่าน">
    </div>

    <button class="btn" onclick="login()">เข้าสู่ระบบ</button>

    <!-- 🔙 BACK HOME -->
    <a href="index.html" class="btn-back">← กลับไปหน้า Home</a>

    <div class="note">
      * สำหรับการทดลองระบบ (ยังไม่ใช่ระบบสมาชิกจริง)
    </div>
  </div>
</div>

<script>
function login(){
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if(user && pass){
    localStorage.setItem("isLogin","true");
    localStorage.setItem("username",user);
    window.location.href = "index.html";
  }else{
    alert("กรุณากรอกข้อมูลให้ครบ");
  }
}
</script>

</body>
</html>
